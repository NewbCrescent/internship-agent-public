<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Robotics Software Intern at Fixture Robotics</title>
<style>
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .select__control { display: flex; border: 1px solid #888; min-height: 32px; width: 320px; }
  .select__value-container { flex: 1; position: relative; }
  .select__input { border: 0; width: 100%; min-height: 28px; }
  .select-shell { position: relative; }
  .select__menu { border: 1px solid #888; width: 320px; background: #fff; position: absolute; top: 100%; left: 0; z-index: 9999; max-height: 300px; overflow-y: auto; }
  .select__option { padding: 4px; }
  .grecaptcha-badge { width: 256px; height: 60px; position: fixed; bottom: 14px; right: -186px; overflow: hidden; }
</style>
</head>
<body>
  <!--
    A fictional Greenhouse job board page ("Fixture Robotics"), hand-reduced from the structure of
    job-boards.greenhouse.io application forms captured read-only on 2026-11-19 (glowpathinc,
    orbitline, tidewave, ironvaleindustries): label[for] and aria-label inputs with a "*" span and
    aria-required, react-select lists (an input[role=combobox].select__input plus a hidden
    required "shadow" input), upload groups labelled by aria-labelledby with "Attach" labels on
    the file inputs, a fieldset checkbox group, and the invisible reCAPTCHA Enterprise machinery
    (the badge iframe with size=invisible and the hidden g-recaptcha-response textarea).
    The "Location (City)" list is Greenhouse's async react-select: no options until something is
    typed, then matching places a moment later (option texts assumed, not captured).
    The education block (School, Degree, Discipline, Start/End date month as react-select lists,
    Start/End date year as number inputs; ids school--0, degree--0, discipline--0, start-month--0,
    start-year--0, end-month--0, end-year--0) follows a read-only capture of a public Greenhouse
    page on 2026-11-20 (ids and react-select structure only; option texts fictional or assumed).
    School and Discipline search their catalogs as you type: opening one shows only a first page
    (data-page), typing shows the matches (data-async). Captured on 2026-11-20: the real lists are
    async paginated catalogs (/v1/boards/<token>/education/schools|degrees|disciplines?term=&page=),
    and the school catalog spells campuses "System - Campus" ("University of Example - Springfield"
    here; school names fictional). Assumed, not captured: the catalog returns entries containing the
    whole typed text, so "University of Example, Springfield" finds nothing and the words before
    the comma find the campuses. The menu is absolutely positioned over the fields below it, as
    Greenhouse's is, and a Delete or Backspace in an async list's input, or an edit that empties
    it, opens its menu at once
    (seen on a local replica of a captured Greenhouse page: after a failed search, Escape then an
    empty fill left the School menu open over the fields below). Degree's "Bachelor’s Degree" keeps the
    curly apostrophe. The phone "Country" list shows only the chosen dialing code ("+1") as its
    value, as Greenhouse does; window.fixture.selects keeps the full option text.
    "Preferred First Name" is an optional text input. "HISTORY WITH FIXTURE ROBOTICS" (a Yes/No list)
    and "Legal First Name" carry Greenhouse's `<id>-description` question description after the
    control, as captured on 2026-11-20 (Ironvale's "HISTORY WITH IRONVALE"; the texts are fictional).
    An optional employment block follows (Company name, Title, and Start/End date month and year
    with the same English labels as education but Greenhouse's employment ids start-date-month--0,
    start-date-year--0, end-date-month--0, end-date-year--0, from the same capture's client
    bundle; the English labels are assumed). It must never take education dates.
    Query switches: ?captcha=checkbox|hcaptcha|turnstile (a visible challenge widget),
    ?captcha=after-submit (the image challenge appears on submit), ?refuse=1 (the site refuses).
    Post-submit outcomes (derived from public knowledge of the new board, not captured):
    ?confirm=redirect (the submit goes to <job>/confirmation, greenhouse-confirmation.html),
    ?confirm=inline (the form is replaced by "Thank you for applying." without a URL change),
    ?invalid=1 (Email and School re-render as invalid: aria-invalid="true" and a shown
    `<id>-error` helper text "This field is required."), ?silent=1 (the submit does nothing).
    ?code=1 (derived from third-party descriptions of the new board, not captured: eight
    one-character boxes #security-input-0..7 and a second Submit; the wording is assumed): the
    submit shows the security-code step; its own Submit (disabled until all eight boxes hold a
    character) accepts the fictional code K7QPZXMW and shows "Thank you for applying.", any other
    code shows an alert.
    The job description line already says "Thank you for your interest", as real descriptions do.
  -->
  <main id="app">
    <h1>Robotics Software Intern</h1>
    <p class="job-description">Thank you for your interest in Fixture Robotics.</p>
    <form id="application-form" class="application--form" novalidate>
      <div class="application--questions">
        <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
          <label id="first_name-label" for="first_name" class="label label">First Name<span aria-hidden="true">*</span></label>
          <input id="first_name" class="input input__single-line" aria-label="First Name" aria-describedby="first_name-description first_name-error first_name-help" aria-required="true" type="text" maxlength="255" autocomplete="given-name">
        </div></div></div>
        <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
          <label id="last_name-label" for="last_name" class="label label">Last Name<span aria-hidden="true">*</span></label>
          <input id="last_name" class="input input__single-line" aria-label="Last Name" aria-describedby="last_name-description last_name-error last_name-help" aria-required="true" type="text" maxlength="255" autocomplete="family-name">
        </div></div></div>
        <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
          <label id="preferred_name-label" for="preferred_name" class="label label">Preferred First Name</label>
          <input id="preferred_name" class="input input__single-line" aria-label="Preferred First Name" aria-describedby="preferred_name-description preferred_name-error preferred_name-help" aria-required="false" type="text" maxlength="255">
        </div></div></div>
        <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
          <label id="email-label" for="email" class="label label">Email<span aria-hidden="true">*</span></label>
          <input id="email" class="input input__single-line" aria-label="Email" aria-describedby="email-description email-error email-help" aria-required="true" type="text" maxlength="255" autocomplete="email">
        </div></div></div>
        <div>
          <fieldset class="phone-input">
            <legend class="visually-hidden">Phone</legend>
            <div class="phone-input__country" data-select="country" data-label="Country" data-required="true" data-options="Canada +1|United States +1|United Kingdom +44"></div>
            <div class="phone-input__phone"><div class="text-input-wrapper"><div class="input-wrapper">
              <label id="phone-label" for="phone" class="label label">Phone<span aria-hidden="true">*</span></label>
              <input id="phone" class="input input__single-line iti__tel-input" aria-label="Phone" aria-describedby="phone-description phone-error phone-help" aria-required="true" type="tel">
            </div></div></div>
          </fieldset>
        </div>
        <div class="field-wrapper" data-select="candidate-location" data-label="Location (City)" data-required="false" data-async="Berkeley, California, United States|Berkeley, Missouri, United States|Berkeley Heights, New Jersey, United States"></div>
        <div class="file-upload-field">
          <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
            <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
            <div class="file-upload__wrapper"><div class="button-container"><div class="secondary-button"><div>
              <button type="button" class="btn btn--pill" data-attach="resume">Attach</button>
              <label class="visually-hidden" for="resume">Attach</label>
              <input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
            </div></div></div></div>
            <p class="file-upload__filename" id="resume-name"></p>
          </div>
        </div>
        <div class="file-upload-field">
          <div role="group" aria-labelledby="upload-label-cover_letter" aria-required="false" class="file-upload">
            <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
            <div class="file-upload__wrapper"><div class="button-container"><div class="secondary-button"><div>
              <button type="button" class="btn btn--pill" data-attach="cover_letter">Attach</button>
              <label class="visually-hidden" for="cover_letter">Attach</label>
              <input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
            </div></div></div></div>
            <p class="file-upload__filename" id="cover_letter-name"></p>
          </div>
        </div>
        <div class="education--container">
          <div class="field-wrapper" data-select="school--0" data-label="School" data-required="true"
            data-page="Abbott Example College|Acme Example Institute|Adams Example University|Alder Example College|Ashford Example University|Aspen Example College|Atlas Example Institute|Avery Example University"
            data-async="University of Example - Springfield|University of Example - Shelbyville|Example State University"></div>
          <div class="field-wrapper" data-select="degree--0" data-label="Degree" data-required="true"
            data-options="High School|Associate's Degree|Bachelor’s Degree|Master's Degree|Doctor of Philosophy (Ph.D.)|Other"></div>
          <div class="field-wrapper" data-select="discipline--0" data-label="Discipline" data-required="true"
            data-page="Accounting|African Studies|Agriculture"
            data-async="Computer Science|Computer Engineering|Cognitive Science"></div>
          <div class="field-wrapper" data-select="start-month--0" data-label="Start date month" data-required="false"
            data-options="January|February|March|April|May|June|July|August|September|October|November|December"></div>
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="start-year--0-label" for="start-year--0" class="label label">Start date year</label>
            <input id="start-year--0" class="input input__single-line" aria-label="Start date year" aria-describedby="start-year--0-description start-year--0-error start-year--0-help" aria-required="false" type="number">
          </div></div></div>
          <div class="field-wrapper" data-select="end-month--0" data-label="End date month" data-required="true"
            data-options="January|February|March|April|May|June|July|August|September|October|November|December"></div>
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="end-year--0-label" for="end-year--0" class="label label">End date year<span aria-hidden="true">*</span></label>
            <input id="end-year--0" class="input input__single-line" aria-label="End date year" aria-describedby="end-year--0-description end-year--0-error end-year--0-help" aria-required="true" type="number">
          </div></div></div>
        </div>
        <div class="employment--container">
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="company-name--0-label" for="company-name--0" class="label label">Company name</label>
            <input id="company-name--0" class="input input__single-line" aria-label="Company name" aria-describedby="company-name--0-description company-name--0-error company-name--0-help" aria-required="false" type="text" maxlength="255">
          </div></div></div>
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="title--0-label" for="title--0" class="label label">Title</label>
            <input id="title--0" class="input input__single-line" aria-label="Title" aria-describedby="title--0-description title--0-error title--0-help" aria-required="false" type="text" maxlength="255">
          </div></div></div>
          <div class="field-wrapper" data-select="start-date-month--0" data-label="Start date month" data-required="false"
            data-options="January|February|March|April|May|June|July|August|September|October|November|December"></div>
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="start-date-year--0-label" for="start-date-year--0" class="label label">Start date year</label>
            <input id="start-date-year--0" class="input input__single-line" aria-label="Start date year" aria-describedby="start-date-year--0-description start-date-year--0-error start-date-year--0-help" aria-required="false" type="number">
          </div></div></div>
          <div class="field-wrapper" data-select="end-date-month--0" data-label="End date month" data-required="false"
            data-options="January|February|March|April|May|June|July|August|September|October|November|December"></div>
          <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
            <label id="end-date-year--0-label" for="end-date-year--0" class="label label">End date year</label>
            <input id="end-date-year--0" class="input input__single-line" aria-label="End date year" aria-describedby="end-date-year--0-description end-date-year--0-error end-date-year--0-help" aria-required="false" type="number">
          </div></div></div>
        </div>
        <div>
          <div class="field-wrapper" data-select="question_9004" data-label="HISTORY WITH FIXTURE ROBOTICS" data-required="true" data-options="Yes|No"></div>
          <div class="body body__secondary"><div id="question_9004-description" class="question-description"><p>Have you previously applied to a position at Fixture Robotics?</p></div></div>
        </div>
        <div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper">
          <label id="question_9005-label" for="question_9005" class="label label">Legal First Name<span aria-hidden="true">*</span></label>
          <input id="question_9005" class="input input__single-line" aria-label="Legal First Name" aria-describedby="question_9005-description question_9005-error question_9005-help" aria-required="true" type="text" maxlength="255">
          <div class="body body__secondary"><div id="question_9005-description" class="question-description"><p>As shown on your government-issued ID.</p></div></div>
        </div></div></div>
        <div class="field-wrapper" data-select="question_9001" data-label="Are you legally authorized to work in the United States?" data-required="true" data-options="Yes|No"></div>
        <div class="field-wrapper">
          <fieldset class="checkbox" id="question_9002[]" aria-required="true">
            <legend class="label checkbox__description">How did you hear about us? <span class="required">*</span></legend>
            <div class="checkbox__wrapper"><div class="checkbox__input"><input description="How did you hear about us?" required type="checkbox" id="question_9002[]_1" name="question_9002[]" value="1"></div><label for="question_9002[]_1">LinkedIn</label></div>
            <div class="checkbox__wrapper"><div class="checkbox__input"><input description="How did you hear about us?" required type="checkbox" id="question_9002[]_2" name="question_9002[]" value="2"></div><label for="question_9002[]_2">Glassdoor</label></div>
            <div class="checkbox__wrapper"><div class="checkbox__input"><input description="How did you hear about us?" required type="checkbox" id="question_9002[]_3" name="question_9002[]" value="3"></div><label for="question_9002[]_3">Indeed</label></div>
            <div class="checkbox__wrapper"><div class="checkbox__input"><input description="How did you hear about us?" required type="checkbox" id="question_9002[]_4" name="question_9002[]" value="4"></div><label for="question_9002[]_4">Referred by a friend</label></div>
          </fieldset>
        </div>
        <div class="field-wrapper">
          <fieldset class="checkbox" id="question_9003[]" aria-required="false">
            <legend class="label checkbox__description">Updates</legend>
            <div class="checkbox__wrapper"><div class="checkbox__input"><input type="checkbox" id="question_9003[]_1" name="question_9003[]" value="1"></div><label for="question_9003[]_1">Send me updates about future openings</label></div>
          </fieldset>
        </div>
      </div>
      <div id="form-errors"></div>
      <div class="application--submit"><button type="submit" class="btn btn--pill" aria-disabled="false">Submit application</button></div>
    </form>
  </main>
  <div id="captcha-area"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const state = { uploads: { resume: null, cover_letter: null }, checked: [], selects: {}, submitted: false, formSubmits: 0, securitySubmits: 0, codeAccepted: false };
    window.fixture = state;

    // React-select lists, as Greenhouse draws them: options exist only while the menu is open.
    for (const host of document.querySelectorAll("[data-select]")) {
      const id = host.dataset.select;
      const star = host.dataset.required === "true" ? '<span aria-hidden="true">*</span>' : "";
      host.innerHTML = `<div class="select"><div class="select__container">
        <label id="${id}-label" for="${id}" class="label select__label">${host.dataset.label}${star}</label>
        <div class="select-shell" data-shell="${id}">
          <span class="a11yText"></span>
          <div><div class="select__control"><div class="select__value-container">
            <div class="select__placeholder" id="react-select-${id}-placeholder">Select...</div>
            <div class="select__input-container"><input class="select__input" id="${id}" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="${id}-label" aria-required="${host.dataset.required}" role="combobox" aria-describedby="react-select-${id}-placeholder ${id}-error"></div>
          </div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout" tabindex="-1"></button></div></div></div>
          <div class="select__menu-slot"></div>
          ${host.dataset.required === "true" ? '<input required tabindex="-1" aria-hidden="true" class="fixture-requiredInput">' : ""}
        </div></div></div>`;
    }
    const shellOf = (id) => document.querySelector(`[data-shell="${id}"]`);
    const hostOf = (id) => document.querySelector(`[data-select="${id}"]`);
    // An async list offers only the entries matching what was typed; before typing, its first
    // page (data-page, School and Discipline) or nothing (Location (City)).
    const optionsOf = (id) => {
      const host = hostOf(id);
      if (!host.dataset.async) return host.dataset.options.split("|");
      const typed = document.getElementById(id).value.trim().toLowerCase();
      if (!typed) return host.dataset.page ? host.dataset.page.split("|") : [];
      return host.dataset.async.split("|").filter((option) => option.toLowerCase().includes(typed));
    };
    function openMenu(id) {
      const slot = shellOf(id).querySelector(".select__menu-slot");
      const options = optionsOf(id);
      slot.innerHTML = `<div class="select__menu"><div class="select__menu-list" role="listbox" id="react-select-${id}-listbox">${options.length ? options
        .map((option, index) => `<div class="select__option" role="option" id="react-select-${id}-option-${index}" data-for="${id}">${option}</div>`).join("")
        : '<div class="select__menu-notice">Start typing to search</div>'}</div></div>`;
      document.getElementById(id).setAttribute("aria-expanded", "true");
    }
    let searchTimer = null;
    document.addEventListener("input", (event) => {
      const input = event.target.closest(".select__input");
      if (!input || !hostOf(input.id)?.dataset.async) return;
      clearTimeout(searchTimer);
      // Emptying the box opens its menu at once (its first page); typing searches a moment later.
      if (!input.value) { closeMenus(); openMenu(input.id); return; }
      searchTimer = setTimeout(() => openMenu(input.id), 250);
    });
    function closeMenus() {
      for (const slot of document.querySelectorAll(".select__menu-slot")) slot.innerHTML = "";
      for (const input of document.querySelectorAll(".select__input")) input.setAttribute("aria-expanded", "false");
    }
    document.addEventListener("mousedown", (event) => {
      const control = event.target.closest(".select__control");
      if (control) { closeMenus(); openMenu(control.querySelector(".select__input").id); }
    });
    document.addEventListener("click", (event) => {
      const option = event.target.closest(".select__option");
      if (option) {
        const id = option.dataset.for;
        state.selects[id] = option.textContent;
        const container = shellOf(id).querySelector(".select__value-container");
        container.querySelector(".select__placeholder")?.remove();
        container.querySelector(".select__single-value")?.remove();
        // The phone-country list shows only the chosen dialing code ("+1"), as Greenhouse's does.
        const shown = id === "country" ? option.textContent.replace(/^.*\s(\+\d{1,4})$/, "$1") : option.textContent;
        container.insertAdjacentHTML("afterbegin", `<div class="select__single-value">${shown}</div>`);
        const shadow = shellOf(id).querySelector(".fixture-requiredInput");
        if (shadow) shadow.value = option.textContent;
        closeMenus();
        return;
      }
      const attach = event.target.closest("[data-attach]");
      if (attach) document.getElementById(attach.dataset.attach).click();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMenus();
      // Deleting text in an async list opens its menu at once, as on the real board.
      const input = event.target.closest?.(".select__input");
      if ((event.key === "Delete" || event.key === "Backspace") && input && hostOf(input.id)?.dataset.async) {
        closeMenus();
        openMenu(input.id);
      }
    });
    document.addEventListener("change", (event) => {
      if (event.target.type === "file") {
        state.uploads[event.target.id] = event.target.files[0]?.name ?? null;
        document.getElementById(`${event.target.id}-name`).textContent = state.uploads[event.target.id] ?? "";
      }
      if (event.target.type === "checkbox") {
        state.checked = [...document.querySelectorAll('input[type="checkbox"]:checked')].map((box) => document.querySelector(`label[for="${CSS.escape(box.id)}"]`).textContent);
      }
    });

    // The invisible reCAPTCHA Enterprise machinery Greenhouse loads on every board page.
    const badge = `<div class="grecaptcha-badge" data-style="bottomright"><div class="grecaptcha-logo">
      <iframe title="reCAPTCHA" width="256" height="60" role="presentation" frameborder="0" scrolling="no" src="https://www.recaptcha.net/recaptcha/enterprise/anchor?k=FIXTURE&size=invisible"></iframe></div>
      <div class="grecaptcha-error"></div>
      <textarea id="g-recaptcha-response-100000" name="g-recaptcha-response" class="g-recaptcha-response" style="width:250px;height:40px;display:none;"></textarea></div>
      <div id="bframe-holder" style="visibility:hidden;position:absolute;top:-10000px;left:0;">
        <iframe title="recaptcha challenge expires in two minutes" width="400" height="580" src="https://www.recaptcha.net/recaptcha/enterprise/bframe?k=FIXTURE"></iframe></div>`;
    const visible = {
      checkbox: '<iframe title="reCAPTCHA" width="304" height="78" src="https://www.google.com/recaptcha/api2/anchor?k=FIXTURE&size=normal"></iframe>',
      hcaptcha: '<iframe title="Widget containing checkbox for hCaptcha security challenge" width="303" height="78" src="https://newassets.hcaptcha.com/captcha/v1/x/static/hcaptcha.html#frame=checkbox"></iframe>',
      turnstile: '<iframe title="Widget containing a Cloudflare security challenge" width="300" height="65" src="https://challenges.cloudflare.com/cdn-cgi/challenge-platform/x"></iframe>'
    };
    document.getElementById("captcha-area").innerHTML = badge + (visible[params.get("captcha")] ?? "");

    function missingRequired() {
      const missing = [];
      for (const id of ["first_name", "last_name", "email", "phone"]) if (!document.getElementById(id).value.trim()) missing.push(id);
      for (const id of ["country", "question_9001"]) if (!state.selects[id]) missing.push(id);
      if (!state.uploads.resume) missing.push("resume");
      if (!document.querySelector('[name="question_9002[]"]:checked')) missing.push("question_9002");
      return missing;
    }
    document.getElementById("application-form").addEventListener("submit", (event) => {
      event.preventDefault();
      state.formSubmits += 1;
      const errors = document.getElementById("form-errors");
      if (params.get("captcha") === "after-submit") {
        const holder = document.getElementById("bframe-holder");
        holder.style.visibility = "visible";
        // In view of the scrolled page, as reCAPTCHA places its challenge.
        holder.style.top = `${window.scrollY + 10}px`;
        return;
      }
      if (params.get("refuse") === "1") {
        errors.innerHTML = '<div role="alert">There was a problem submitting your application.</div>';
        return;
      }
      if (params.get("code") === "1") {
        // Greenhouse's emailed security-code step (derived, not captured).
        if (!document.getElementById("security-code")) {
          const boxes = Array.from({ length: 8 }, (_, index) =>
            `<input id="security-input-${index}" class="security-input" type="text" maxlength="1" aria-label="Security code character ${index + 1}" autocomplete="off">`).join("");
          document.querySelector(".application--submit").insertAdjacentHTML("afterend", `<div id="security-code" class="security-code">
            <p class="security-code__title">Security code</p>
            <p>We sent an 8-character security code to your email address. Enter it below, then submit your application again.</p>
            <div class="security-code__inputs">${boxes}</div>
            <button type="button" id="security-submit" class="btn btn--pill" disabled>Submit application</button>
          </div>`);
        }
        return;
      }
      if (params.get("confirm") === "redirect") {
        state.submitted = true;
        location.assign(location.pathname + "/confirmation");
        return;
      }
      if (params.get("confirm") === "inline") {
        state.submitted = true;
        document.getElementById("app").innerHTML = "<h1>Thank you for applying.</h1><p>We’ve received your application and will be in touch.</p>";
        return;
      }
      if (params.get("invalid") === "1") {
        for (const id of ["email", "school--0"]) {
          const control = document.getElementById(id);
          control.setAttribute("aria-invalid", "true");
          if (!document.getElementById(`${id}-error`)) {
            control.closest(".field-wrapper").insertAdjacentHTML("beforeend", `<p id="${id}-error" class="helper-text helper-text--error">This field is required.</p>`);
          }
        }
        return;
      }
      if (params.get("silent") === "1") return;
      const missing = missingRequired();
      if (missing.length) {
        errors.innerHTML = `<div role="alert">Please complete the required fields: ${missing.join(", ")}</div>`;
        return;
      }
      state.submitted = true;
      document.getElementById("app").innerHTML = "<h1>Thank you for applying.</h1><p>Your application has been received.</p>";
    });
    // The security-code step: a typed character moves to the next box; its Submit enables once all eight hold one.
    document.addEventListener("input", (event) => {
      const box = event.target.closest?.(".security-input");
      if (!box) return;
      const boxes = [...document.querySelectorAll(".security-input")];
      const index = boxes.indexOf(box);
      if (box.value.length === 1 && boxes[index + 1]) boxes[index + 1].focus();
      document.getElementById("security-submit").disabled = !boxes.every((entry) => entry.value.length === 1);
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest?.("#security-submit")) return;
      state.securitySubmits += 1;
      const code = [...document.querySelectorAll(".security-input")].map((entry) => entry.value).join("");
      if (code === "K7QPZXMW") {
        state.codeAccepted = true;
        state.submitted = true;
        document.getElementById("app").innerHTML = "<h1>Thank you for applying.</h1><p>Your application has been received.</p>";
      } else {
        document.getElementById("form-errors").innerHTML = '<div role="alert">The security code is incorrect.</div>';
      }
    });
  </script>
</body>
</html>
