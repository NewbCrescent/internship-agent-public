<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Software Engineer Intern | Careers at Fixture Robotics</title></head>
<body>
  <!--
    The page iCIMS's Apply reaches after its redirect (careers-fixture.icims.com/jobs/9001/intern/
    login?in_iframe=1), reduced from two read-only 2026-11-20 captures of public iCIMS apply steps:
    "Enter Your Information" with an Email field, a GDPR "I agree" checkbox (#accept_gdpr, present on
    one of the two), and an input[type=submit] "Next". This is iCIMS's email-first account step,
    which the agent never types into. Tokens and personal data were stripped; texts are fictional.
  -->
  <div id="iCIMS_Header"><h1 class="iCIMS_Header">Enter Your Information</h1></div>
  <div class="description"><p>Fixture Robotics uses iCIMS to manage applications.</p></div>
  <form id="loginForm" method="post" action="/jobs/9001/intern/login?in_iframe=1">
    <div class="iCIMS_TableRow">
      <label for="email">Email</label>
      <input type="email" id="email" name="loginName" required>
    </div>
    <div class="iCIMS_TableRow">
      <input type="checkbox" id="accept_gdpr" name="accept_gdpr" required>
      <label for="accept_gdpr">I agree</label>
    </div>
    <input type="submit" id="enterEmailSubmitButton" class="iCIMS_Button" value="Next">
  </form>
  <div class="iCIMS_Logo"><p class="iCIMS_Logo_Text">Software Powered by iCIMS</p></div>
</body>
</html>
