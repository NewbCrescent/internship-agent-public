<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture Robotics Robotics Software Intern | SmartRecruiters</title>
<style>.modal { display: none; }</style>
</head>
<body>
  <!--
    A fictional SmartRecruiters posting page ("Fixture Robotics"), reduced from the structure captured
    read-only on 2026-11-24 at jobs.smartrecruiters.com: a hidden "Share to WeChat" dialog holds a text
    box with neither id nor name (aria-label "Copy the link and open WeChat to share."), which the
    control reader returns as an optional question; "I'm interested" links to the separate application
    page (/oneclick-ui/company/<company>/publication/<id>), which showed a DataDome CAPTCHA page to the
    fresh, headful capture browser as well. It carries no real company, job id, or personal data.
  -->
  <main class="job-sections">
    <h1 class="job-title">Robotics Software Intern</h1>
    <p class="job-location">Fixture City, CALIFORNIA, United States</p>
    <a class="button button--primary js-oneclick" id="st-apply" href="/oneclick-ui/company/FixtureRobotics/publication/00000000-0000-4000-8000-000000000003?dcr_ci=FixtureRobotics">I'm interested</a>
    <button class="ot-sdk-show-settings link button--clean">Cookies Settings</button>
  </main>
  <div class="modal" aria-hidden="true">
    <h4 class="modal-title">Share to WeChat</h4>
    <button class="button button--clean modal-close">×</button>
    <p class="column details-desc">Copy the link and open WeChat to share.</p>
    <input class="column display--block details-title" type="text" aria-label="Copy the link and open WeChat to share.">
    <button class="button button--secondary" id="wechat-copy-clipboard">Copy to clipboard</button>
  </div>
</body>
</html>
