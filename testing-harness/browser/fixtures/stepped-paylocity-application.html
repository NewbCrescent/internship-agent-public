<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Robotics Software Intern - Fixture Pay Robotics</title>
<style>
  #onetrust-banner-sdk { position: fixed; bottom: 0; left: 0; right: 0; background: #eee; padding: 12px; z-index: 10; }
</style>
</head>
<body class="citrus">
  <!--
    A fictional Paylocity-style several-page application ("Fixture Pay Robotics", job 1000002) on one address, its
    steps drawn in place (Track 74). MODELLED: step 1's structure is derived from paylocity-application.html (itself
    reduced from a 2026-11-24 read-only capture of a live Paylocity Recruiting page): a "Step n of <total>" progress
    header, labels beside their inputs with "(required)" in an em, a "Next Step" button with id btn-submit and no
    form element, and a OneTrust banner. The live form shows "Step 1 of 5"; this one has three steps. Steps 2 and 3
    were never captured on a live site: their fields, that the address stays the same, and the last step's
    "Submit Application" button are assumptions. Every name, host, id, and value is fictional.
    Variants: `?nocount=1` drops the "Step n of 3" text; `?both=1` shows a "Submit" button beside "Next Step" on
    step 2; `?confirm=1` makes step 1's Next Step show "Your application has been submitted." instead of step 2;
    `?county=0` drops step 1's required County box.
    State (step, values, nextClicks, submitClicks, acceptClicks, rejectClicks) is kept in sessionStorage.
  -->
  <div id="onetrust-consent-sdk">
    <div id="onetrust-banner-sdk" class="otFlat">
      <div role="alertdialog" aria-label="Privacy">
        <p>By clicking “Accept All Cookies”, you agree to the storing of cookies on your device.</p>
        <button id="onetrust-pc-btn-handler" class="cookie-setting-link">Cookies Settings</button>
        <button id="onetrust-reject-all-handler">Reject All</button>
        <button id="onetrust-accept-btn-handler">Accept All Cookies</button>
      </div>
    </div>
  </div>
  <div class="container body-content" id="applicant-tracking">
    <input name="__RequestVerificationToken" type="hidden" value="FIXTURE-TOKEN">
    <div id="app">
      <span class="job-apply-title">Robotics Software Intern</span>
      <p class="progress-header"><span class="type-bold" id="progress"></span></p>
      <div id="step-content"></div>
      <div id="buttons"></div>
      <footer>Powered by <a href="https://www.paylocity.example/privacy/">Paylocity Privacy Policy</a></footer>
    </div>
  </div>
  <script>
    const KEY = "fixture-stepped-paylocity";
    const params = new URL(location.href).searchParams;
    const flags = { nocount: params.get("nocount") === "1", both: params.get("both") === "1", confirm: params.get("confirm") === "1", county: params.get("county") !== "0" };
    const load = () => JSON.parse(sessionStorage.getItem(KEY) || "{}");
    const save = (state) => sessionStorage.setItem(KEY, JSON.stringify(state));
    save(Object.assign({ step: 1, values: {}, nextClicks: 0, submitClicks: 0, acceptClicks: 0, rejectClicks: 0, banner: null, done: null }, load()));
    window.fixtureState = () => load();

    const banner = document.getElementById("onetrust-banner-sdk");
    if (load().banner) banner.style.display = "none";
    document.getElementById("onetrust-accept-btn-handler").addEventListener("click", () => {
      const now = load(); now.acceptClicks += 1; now.banner = "accepted"; save(now); banner.style.display = "none";
    });
    document.getElementById("onetrust-reject-all-handler").addEventListener("click", () => {
      const now = load(); now.rejectClicks += 1; now.banner = "rejected"; save(now); banner.style.display = "none";
    });

    const box = (id, label, required) => `<div class="form-group${required ? " form-required" : ""}"><label>${label}${required ? "<span><em> (required)</em></span>" : ""}</label><input data-for="${label}" id="${id}" type="text" value=""${required ? " required" : ""}></div>`;
    const sections = {
      1: () => `<div class="section-wrapper" id="pcty-wr-apply-info"><div class="section-heading">Information</div>
          ${box("info.firstName", "First Name", true)}${box("info.lastName", "Last Name", true)}${box("info.email", "Email Address", true)}
          ${flags.county ? box("public-site-address-county", "County", true) : ""}</div>`,
      2: () => `<div class="section-wrapper"><div class="section-heading">Contact</div>${box("info.cellPhone", "Mobile Number", false)}</div>`,
      3: () => `<div class="section-wrapper"><div class="section-heading">Review</div><p>Check your answers, then send your application.</p></div>`
    };
    const button = (id, text) => `<button class="button form-button branding-button-color full-width" id="${id}">${text}<span></span></button>`;

    function render() {
      const state = load();
      const progress = document.getElementById("progress");
      const content = document.getElementById("step-content");
      const buttons = document.getElementById("buttons");
      if (state.done) {
        progress.textContent = "";
        content.innerHTML = `<div class="section-wrapper"><p>${state.done}</p></div>`;
        buttons.innerHTML = "";
        return;
      }
      progress.textContent = flags.nocount ? "" : `Step ${state.step} of 3`;
      content.innerHTML = sections[state.step]();
      for (const input of content.querySelectorAll("input")) {
        const saved = state.values[`${state.step}:${input.id}`];
        if (saved !== undefined) input.value = saved;
      }
      buttons.innerHTML = state.step < 3
        ? button("btn-submit", "Next Step") + (flags.both && state.step === 2 ? button("btn-send", "Submit") : "")
        : button("btn-apply", "Submit Application");
      document.getElementById("btn-submit")?.addEventListener("click", () => {
        const now = load();
        now.nextClicks += 1;
        for (const input of content.querySelectorAll("input")) now.values[`${now.step}:${input.id}`] = input.value;
        if (flags.confirm && now.step === 1) now.done = "Your application has been submitted.";
        else now.step += 1;
        save(now);
        render();
      });
      const send = () => {
        const now = load(); now.submitClicks += 1; now.done = "Thank you for applying! Your application was received."; save(now); render();
      };
      document.getElementById("btn-apply")?.addEventListener("click", send);
      document.getElementById("btn-send")?.addEventListener("click", send);
    }
    render();
  </script>
</body>
</html>
