<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture Aerospace Careers</title>
<style>html[data-fixture-login] [data-automation-id="jobPostingPage"] { display: none; }</style>
<script>if (/\/login$/.test(location.pathname)) document.documentElement.setAttribute("data-fixture-login", "");</script>
</head>
<body>
  <!-- A fictional Workday-style career site. Markers mirror Workday's data-automation-id attributes. -->
  <button data-automation-id="utilityButtonSignIn">Sign In</button>
  <main id="app">
    <section data-automation-id="jobPostingPage">
      <h2>Software Engineering Intern</h2>
      <a href="#" data-automation-id="adventureButton">Apply</a>
    </section>
  </main>
  <div id="popup"></div>
  <script>
    const params = new URLSearchParams(location.search);
    // Candidate accounts (?account=create|verify|captcha|exists|sms|double|silent|silent-chooser|lost|banner|signin-after|notice|quiet|login-redirect):
    // accounts live in localStorage (shared by the context's tabs), the signed-in session in
    // sessionStorage (per tab, so every new tab starts signed out).
    //   create: the account is created and the application opens; verify: Workday asks to verify
    //   the email; captcha: a challenge frame; exists: "already exists" and nothing is stored;
    //   sms: a text-message code; double: the account is stored, then "already exists" shows;
    //   silent: the account is stored and nothing changes on screen; silent-chooser: the
    //   same, but the Sign In link opens an email-method chooser; lost: nothing is stored and
    //   nothing changes; banner: nothing is stored and an error banner shows; signin-after: the
    //   account is stored verified and the sign-in form shows with no session (the real sites'
    //   observed flow after a create); notice: the account is stored unverified and the sign-in
    //   form shows, and signing in to it writes a plain-text "not been verified" notice (not an
    //   error element) and keeps the form; quiet: the same, but signing in to the unverified
    //   account changes nothing on screen; login-redirect (synthetic, modelled on nvidia.wd5's read-only
    //   captures and Workday's public create handler, 2026-11-25): the account step opens on the
    //   email-method chooser (Google, LinkedIn, email), the in-flow Sign In link returns to it, a
    //   successful create stores the account unverified and sends the page to the site's /login with
    //   the same query, which shows only the chooser (no apply flow), and signing in to the unverified
    //   account shows Workday's generic failure.
    // &signin-error=generic|locked: a failed sign-in shows Workday's generic message (generic: "You may
    // have entered the wrong email address or password or your account might be locked.", seen on 11
    // tenants on 2026-11-25) or a real lockout message (locked) instead of "Wrong email address or password.".
    // ?header=filter (synthetic, not seen on a capture: the 2026-11-20 read-only capture of
    // employer-g.wd5's /login showed only the form's own "Sign In" filter, beside
    // signInSubmitButton in noCaptchaWrapper): the header's Sign In is drawn under its own
    // click_filter labelled "Sign In", earlier on the page than the form's; clicking it only counts.
    // ?filter=submit (with markup=real): the sign-in form's click filter is labelled "Submit" while
    // its button reads Sign In, as a read-only capture of rockwellautomation.wd1's sign-in step showed
    // on 2026-11-24 (Workday labels the filter by its internal auth view; the create filter there
    // reads "Create Account").
    // &resend=1: signing in to an unverified account shows Workday's alert "Verify your account before you sign in or
    // request a verification email." and, below it, "Still can't sign in? Be sure to check your spam folder, your account
    // may need verification" with a "Resend Account Verification" control (texts captured from read-only workday-account
    // evidence, 2026-11-25 and 2026-11-26; the control's markup, a plain button, is modelled: no DOM was captured).
    // Clicking it gives the account for the email field's value, if unverified, a new token (the old one no longer
    // verifies), counts the click in localStorage "fixture-workday-resends", and shows "We sent a new verification email.
    // Check your inbox." (modelled).
    // &forgot (modelled, except the captured forgotPasswordLink id of the 2026-11-19 captures): the synthetic create and
    // sign-in forms draw "Forgot your password?" (forgotPasswordLink), and a click on that control, in any markup, opens a
    // Forgot Password form (email field, a "Submit" click filter over forgotPasswordSubmitButton in a noCaptchaWrapper,
    // like the real create button's markup). Its submit gives the email's account, if any, a resetToken and the page's
    // &reset value, counts the request in localStorage "fixture-workday-resets", and always shows "If an account exists
    // for this email address, we sent you a link to reset your password.". Without &forgot nothing changes.
    // /<site>/passwordreset/<token> (modelled, beside /activate/<token>): the reset page for the account with that token:
    // a CAPTCHA frame only (&reset=captcha at the request), "This link has expired or is no longer valid." (no such
    // account), or New Password / Verify New Password with a "Submit" click filter over resetPasswordSubmitButton; a
    // matching password that meets the create step's rule replaces the account's password, drops the token, and shows
    // "Your password has been reset.".
    // &reset=silent (Track 75; the end state is captured from three real hosts' workday-account evidence, 2026-11-27: the Forgot Password form still on screen with the email typed, no message, no error, and no email; the cause is not known, so the drop is modelled): the Forgot Password submit is dropped with no message, no token and no request count; localStorage "fixture-workday-ignored-resets" counts the drops.
    // ?dwell=1 (like Workday's sign-in widget, candidate-experience-apply-flow 2026.47.19, read 2026-11-24): an account submit clicked under 500 ms after its submit button mounted is dropped with no message; window.fixtureAccount counts the drops (ignoredSubmits) and records each submit's delay from its button's mount (submitDelays, ms).
    // Save and Continue validation draws Workday-style errors: an errorMessage alert inside each
    // missing field's formField-* container, an errorBanner listing them, and a plain
    // errorMessage for missing items that have no container (history rows, Resume/CV).
    // ?hidden=<ms> (synthetic, the cause was not seen on a live page): the first time My Information
    // is drawn, its field containers stay display:none for that many milliseconds, then show.
    // ?widgets=real (synthetic, modeled on the 2026-11-25 real pauses and public notes on Workday's markup):
    // picked prompt items sit in a role="listbox" list with role="option" items (the Country Phone Code
    // chip was read into Phone Device Type's options on rockwellautomation.wd1, highmarkhealth.wd1 and
    // micron.wd1); a dropdown's list opens in an activeListContainer portal named by the button's
    // aria-controls, 400 ms after the click; a list closed with Escape stays on screen 300 ms; a prompt's
    // list shows 600 ms after its input is clicked and a category's sub-list 900 ms after the category is
    // clicked; each date section draws its dateSection…-display over the spinbutton input, which takes no click.
    // A history search list (school, field of study) is drawn over the controls below its input, and the
    // multi-select Field of Study list stays open after a pick until Escape (the Sierra Space / Micron Add
    // Another timeouts, 2026-11-25); the degree list offers "GED (High School Equivalent)" before "High School
    // Diploma" (rockwellautomation.wd1 run <run id>).
    const realWidgets = params.get("widgets") === "real";
    // ?gaps=1: Synthetic, modeled on the 2026-11-25 real pauses (no form-step DOM was captured). Phone Device Type
    // offers Workday's "Home Mobile" style options (xboxgaming.wd1); My Experience's resume input sits in a
    // formField container with an empty suffix labelled "Upload a file (5MB max)" (littelfuse.wd1, zoll.wd5);
    // Application Questions adds a required start date drawn as Month, Day and Year sections (neogen.wd5),
    // recorded as state.values["formField-earliestStart"] = "MM/DD/YYYY". The previous-worker radios are labelled
    // by their question (aria-labelledby), so their accessible name is the question while label[for] still says
    // Yes/No (employer-e.wd5, 2026-11-25: "the page did not accept the value" on this radio; no form-step DOM was
    // captured); the chosen option is recorded as state.values["formField-candidateIsPreviousWorker"].
    const gaps = params.get("gaps") === "1";
    // ?upload=slow|fail (synthetic, modeled on the 2026-11-25 evidence of neogen.wd5, itw.wd5, littelfuse.wd1,
    // Activision and zoll.wd5): a chosen resume shows "<file> loading" in an alert for 2.5 s with the file listed,
    // then "<file> successfully uploaded" and "Successfully Uploaded!" (slow) or Workday's "Your document can't be
    // uploaded." error (fail, wording from a public university notice about a Workday upload error, 2023); the file
    // counts as attached only once loaded; with upload set, Save and Continue on My Experience moves after 1 s, the
    // status alert still on screen.
    const uploadMode = params.get("upload");
    // ?fos=required (modeled on the Activision / xboxgaming.wd1 evidence, 2026-11-25): every education row's
    // "Field of Study*" is required.
    const fosRequired = params.get("fos") === "required";
    // ?edudates=ids|none (synthetic; rockwellautomation.wd1's run <run id> found neither education date by label
    // and its markup was not captured): ids labels the education dates "Attended From" / "Attended Until*" in
    // Workday's formField-firstYearAttended / formField-lastYearAttended containers; none draws no education dates.
    const eduDates = params.get("edudates");
    // ?school=text (synthetic, modeled on rockwellautomation.wd1, where both schools were typed as plain text, and
    // the Rockwell/enGen Degree click timeouts): the school is a plain text box whose suggestion layer, drawn inside
    // the field over the controls below it, closes only when the box loses focus.
    const schoolText = params.get("school") === "text";
    // ?lists=micron (synthetic copy of the option texts micron.wd1 offered on 2026-11-25, run <run id>): the degree list names
    // "… Level Degree" options and the field-of-study search offers the plural "Computer sciences".
    const micronLists = params.get("lists") === "micron";
    // ?linger=<ms> (synthetic, modeled on littelfuse.wd1 run <run id>, 2026-11-25: the run read only a hidden
    // "Resume/CV" upload on the step after My Experience; no DOM was captured): when Save and Continue leaves My
    // Experience without errors, the progress bar moves to the next step at once while My Experience's fields stay
    // in the DOM hidden (#fields display:none) for that many milliseconds; then the next step is drawn.
    const lingerMs = Number(params.get("linger") || 0);
    // ?remount=1 with ?school=text (synthetic, modeled on the zoll.wd5 failure of 2026-11-25 13:55Z, whose Degree
    // locator stopped resolving for 30 s; the trigger was not captured): the typed school's suggestion list is drawn
    // as a portal in <body>, and Escape on My Experience re-draws the whole step (fresh DOM, typed values kept), as if
    // Workday re-mounted the rows.
    const remount = params.get("remount") === "1";
    // ?sections=aria (synthetic, modeled on the public description of Workday's My Experience markup and on
    // employer-e.wd5 run <run id>, whose every history row "was not added" while no other field of the step was
    // read; no DOM was captured): each section is a role="group" labelled by its heading (Work-Experience-section,
    // Education-section) with no workExperienceSection marker, its Add is data-automation-id="add-button" carrying
    // visually hidden section text, each row is a role="group" labelled "<Name>-<n>-panel", and a Websites section
    // with a plain "Add" follows the resume; state.websites counts its rows.
    const ariaSections = params.get("sections") === "aria";
    const ACCOUNTS_KEY = "fixture-workday-accounts";
    const SESSION_KEY = "fixture-workday-session";
    const readAccounts = () => JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || "{}");
    const writeAccounts = (accounts) => localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
    // An activation link from the verification email: /<site>/activate/<token>.
    const activation = /\/activate\/([A-Za-z0-9]+)/.exec(location.pathname);
    if (activation) {
      const accounts = readAccounts();
      for (const account of Object.values(accounts)) if (account.token === activation[1]) account.verified = true;
      writeAccounts(accounts);
      document.getElementById("app").innerHTML = "<h2>Your account has been verified.</h2>";
    }
    const accountMode = params.get("account");
    const signInError = params.get("signin-error");
    const resendMode = params.get("resend") === "1";
    const forgotMode = params.has("forgot");
    const passwordReset = /\/passwordreset\/([A-Za-z0-9]+)/.exec(location.pathname);
    const bump = (key) => localStorage.setItem(key, String(Number(localStorage.getItem(key) || 0) + 1));
    window.fixtureAccount = { honeypotTyped: false, termsChecked: false, creates: 0, signIns: 0, emailMethodClicks: 0, headerClicks: 0, ignoredSubmits: 0, submitDelays: [] };
    if (/\/login$/.test(location.pathname)) renderLoginPage();
    if (passwordReset) renderResetPage(passwordReset[1]);
    const dwellMode = params.get("dwell") === "1";
    const submitMounts = new WeakMap();
    if (dwellMode) {
      new MutationObserver(() => {
        for (const button of document.querySelectorAll('[data-automation-id="createAccountSubmitButton"], [data-automation-id="signInSubmitButton"]')) {
          if (!submitMounts.has(button)) submitMounts.set(button, performance.now());
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
    }
    if (params.get("header") === "filter") {
      document.querySelector('[data-automation-id="utilityButtonSignIn"]').outerHTML = `<div data-automation-id="utilityMenu"><div style="position:relative;display:inline-block"><div aria-label="Sign In" role="button" tabindex="0" data-automation-id="click_filter" style="position:absolute;inset:0;z-index:1"></div><button data-automation-id="utilityButtonSignIn" tabindex="-2" aria-hidden="true">Sign In</button></div></div>`;
    }
    const steps = ["My Information", "My Experience", "Application Questions", "Voluntary Disclosures", "Review"];
    // upload: { name, phase: "loading" | "done" | "failed" } | null (?upload only).
    const state = { step: 0, values: {}, submitted: false, resumes: [], transcript: null, work: [], education: [], upload: null, websites: 0 };
    // ?parsed=1: Workday already shows a row parsed from a resume that is not the candidate's.
    if (params.get("parsed") === "1") state.work.push({ title: "Analyst", company: "Resume Parse Corp", location: "", current: false, fromM: "01", fromY: "2020", toM: "02", toY: "2020", description: "" });
    const schools = ["University of California, Berkeley", "University of California, Los Angeles", "Berkeley City College", "Northwind High School"];
    const fields = micronLists
      ? ["Applied Sciences", "Busin.computer sciences", "Computer sciences", "Data Science", "Engineering - Science/Plant", "Environmental Sciences", "Food Science"]
      : ["Computer Science", "Computer Engineering", "Economics"];
    const degrees = micronLists
      ? ["High School/ A levels / STPM/GED", "SPM / O levels / N levels", "Technical Certificate", "Technical / Professional Diploma", "Advanced Diploma/Associate's Level Degree", "Bachelor's Level Degree", "Master's Level Degree", "Doctorate's Level Degree", "Post Doctorate"]
      : [...(realWidgets ? ["GED (High School Equivalent)"] : []), "High School Diploma", "Associate's Degree", "Bachelor of Science (BS)", "Bachelor of Arts (BA)", "Bachelor's Degree", "Master's Degree"];
    window.fixture = state;

    /** Closes every open list: the popup and, with ?widgets=real, the list portals. */
    function clearLists() {
      document.getElementById("popup").innerHTML = "";
      for (const portal of document.querySelectorAll("[data-fixture-list]")) portal.remove();
    }
    const listbox = (id, label, options, selected) => `
      <div data-automation-id="${id}">
        <label for="${id}-button">${label}</label>
        <button type="button" id="${id}-button" aria-haspopup="listbox"${realWidgets ? ` aria-controls="${id}-list"` : ""} data-listbox="${id}" data-options="${options.join("|")}">${selected || "Select One"}</button>
      </div>`;
    // A picked chip; with ?widgets=real it also carries role="option".
    const chip = (text) => realWidgets
      ? `<li data-automation-id="selectedItem" role="option"><span data-automation-id="promptOption">${text}</span></li>`
      : `<li data-automation-id="selectedItem"><span data-automation-id="promptOption">${text}</span></li>`;
    // Search-and-pick prompt: a chip list plus an input; selected chips also carry promptOption, as on Workday.
    const prompt = (id, label, selected) => `
      <div data-automation-id="${id}">
        <label for="${id}-input">${label}</label>
        <div data-automation-id="multiSelectContainer">
          <div data-automation-id="multiselectInputContainer"><input id="${id}-input" data-prompt="${id}"></div>
          <ul data-automation-id="selectedItemList"${realWidgets ? ` role="listbox"` : ""}>${selected ? chip(selected) : ""}</ul>
        </div>
      </div>`;
    const sourceTree = {
      "A Fixture Employee Referred me": ["Employee Referral"],
      "LinkedIn, Monster, Indeed or other Job Board": ["Dice", "Indeed", "LinkedIn"],
      "Social Networks": ["Facebook", "X"]
    };
    const text = (id, label, type = "text") => `
      <div data-automation-id="${id}"><label for="${id}-input">${label}</label><input id="${id}-input" type="${type}" value="${state.values[id] || ""}"></div>`;

    const pages = [
      () => `
        ${text("formField-legalName--firstName", "First Name*")}
        ${text("formField-legalName--lastName", "Last Name*")}
        ${listbox("formField-country", "Country / Territory*", ["Canada", "United States of America"], state.values["formField-country"] || "United States of America")}
        ${listbox("formField-countryRegion", "State*", ["Oregon", "Washington"], state.values["formField-countryRegion"])}
        ${text("formField-city", "City*")}
        ${prompt("formField-source", "How Did You Hear About Us?*", state.values["formField-source"])}
        ${listbox("formField-phoneType", "Phone Device Type*", gaps ? ["Home Mobile", "Home Phone", "Work Mobile", "Work Phone"] : ["Home", "Mobile", "Work"], state.values["formField-phoneType"])}
        ${prompt("formField-countryPhoneCode", "Country Phone Code*", "United States of America (+1)")}
        <div data-automation-id="formField-candidateIsPreviousWorker">
          <label id="prev-question">Have you previously worked for Fixture Aerospace?*</label>
          <input type="radio" id="prev-yes" name="prev" value="true"${gaps ? ' aria-labelledby="prev-question"' : ""}><label for="prev-yes">Yes</label>
          <input type="radio" id="prev-no" name="prev" value="false"${gaps ? ' aria-labelledby="prev-question"' : ""}><label for="prev-no">No</label>
        </div>`,
      () => ariaSections ? ariaExperience() : `
        <div data-automation-id="workExperienceSection">
          <h3>Work Experience</h3>
          ${state.work.map(workPanel).join("")}
          <button type="button" data-add="work">Add</button>
        </div>
        <section>
          <h3>Education</h3>
          ${state.education.map(educationPanel).join("")}
          <button type="button" data-add="education">Add Another</button>
        </section>
        <h3>Resume/CV</h3>
        ${gaps
          ? `<div data-automation-id="formField-"><label>Upload a file (5MB max)</label><input type="file" data-automation-id="file-upload-input-ref" aria-required="true" style="display:none">${resumeStatus()}</div>`
          : `<input type="file" data-automation-id="file-upload-input-ref" style="display:none">
        ${resumeStatus()}`}`,
      () => `
        <div data-automation-id="formField-whyUs"><label for="why">Why do you want to work at Fixture Aerospace?*</label><textarea id="why"></textarea></div>
        ${text("formField-gradYear", "Graduation year*", "number")}
        ${gaps ? `<div data-automation-id="formField-earliestStart"><label>What is the earliest date you can start employment?*</label>
          ${["Month", "Day", "Year"].map((part) => `<input data-automation-id="dateSection${part}-input" aria-label="${part}" data-start="${part}" value="${(state.values["formField-earliestStart"] || "").split("/")[["Month", "Day", "Year"].indexOf(part)] || ""}">`).join("")}</div>` : ""}
        ${params.get("transcript") === "1" ? `<div data-automation-id="formField-transcript"><label for="transcript">Unofficial Transcript*</label><input type="file" id="transcript"></div>` : ""}`,
      () => `
        ${listbox("formField-gender", "Gender*", ["Female", "Male", "Decline to self-identify"], null)}
        <div data-automation-id="formField-agreement"><label for="agree">I have read and agree to the terms*</label><input type="checkbox" id="agree"></div>`,
      () => `<p data-automation-id="reviewSummary">Please review your application.</p>`
    ];

    // Repeating My Experience rows, marked like Workday's panels.
    const historyInput = (kind, index, key) => `data-h="${kind}" data-i="${index}" data-k="${key}"`;
    // A month or year section; with ?widgets=real its display is drawn over the spinbutton input, which takes no click.
    const dateInput = (part, attrs, value) => realWidgets
      ? `<span style="position:relative;display:inline-block"><input data-automation-id="dateSection${part}-input" role="spinbutton" aria-label="${part}" ${attrs} value="${value}"><span data-automation-id="dateSection${part}-display" style="position:absolute;inset:0;background:#fff">${value || (part === "Month" ? "MM" : "YYYY")}</span></span>`
      : `<input data-automation-id="dateSection${part}-input" ${attrs} value="${value}">`;
    const workPanel = (row, index) => `
      ${ariaSections
        ? `<div role="group" aria-labelledby="Work-Experience-${index + 1}-panel"><h4 id="Work-Experience-${index + 1}-panel">Work Experience ${index + 1}</h4>`
        : `<div role="group" data-automation-id="workExperience-${index + 1}">
        <h4>Work Experience ${index + 1}</h4>`}
        <button type="button" data-automation-id="panel-set-delete-button" data-delete="work" data-index="${index}">Delete</button>
        <div data-automation-id="formField-jobTitle"><label for="w${index}t">Job Title*</label><input id="w${index}t" ${historyInput("work", index, "title")} value="${row.title || ""}"></div>
        <div data-automation-id="formField-companyName"><label for="w${index}c">Company*</label><input id="w${index}c" ${historyInput("work", index, "company")} value="${row.company || ""}"></div>
        <div data-automation-id="formField-location"><label for="w${index}l">Location</label><input id="w${index}l" ${historyInput("work", index, "location")} value="${row.location || ""}"></div>
        <div data-automation-id="formField-currentlyWorkHere"><label for="w${index}n">I currently work here</label><input type="checkbox" id="w${index}n" ${historyInput("work", index, "current")} ${row.current ? "checked" : ""}></div>
        <div data-automation-id="formField-startDate"><label>From*</label>
          ${dateInput("Month", historyInput("work", index, "fromM"), row.fromM || "")}
          ${dateInput("Year", historyInput("work", index, "fromY"), row.fromY || "")}</div>
        <div data-automation-id="formField-endDate"><label>To*</label>
          ${dateInput("Month", historyInput("work", index, "toM"), row.toM || "")}
          ${dateInput("Year", historyInput("work", index, "toY"), row.toY || "")}</div>
        <div data-automation-id="formField-roleDescription"><label for="w${index}d">Role Description</label><textarea id="w${index}d" ${historyInput("work", index, "description")}>${row.description || ""}</textarea></div>
      </div>`;
    const educationPanel = (row, index) => `
      ${ariaSections
        ? `<div role="group" aria-labelledby="Education-${index + 1}-panel"><h4 id="Education-${index + 1}-panel">Education ${index + 1}</h4>`
        : `<div role="group" aria-label="Education ${index + 1}">
        <h4>Education ${index + 1}</h4>`}
        <button type="button" data-delete="education" data-index="${index}">Delete</button>
        ${schoolText
          ? `<div data-automation-id="formField-school" style="position:relative"><label for="e${index}s">School or University*</label><input id="e${index}s" ${historyInput("education", index, "school")} data-suggest="1" value="${row.school || ""}"></div>`
          : `<div data-automation-id="formField-school"><label for="e${index}s">School or University*</label>
          <div data-automation-id="multiselectInputContainer"><input id="e${index}s" data-prompt="history:education:${index}:school"></div>
          <ul data-automation-id="selectedItemList">${row.school ? `<li data-automation-id="selectedItem">${row.school}</li>` : ""}</ul></div>`}
        <div data-automation-id="formField-degree"><label for="e${index}g">Degree*</label>
          <button type="button" id="e${index}g" aria-haspopup="listbox" data-listbox="history:education:${index}:degree" data-options="${degrees.join("|")}">${row.degree || "Select One"}</button></div>
        <div data-automation-id="formField-fieldOfStudy"><label for="e${index}f">Field of Study${fosRequired ? "*" : ""}</label>
          <div data-automation-id="multiselectInputContainer"><input id="e${index}f" data-prompt="history:education:${index}:field"></div>
          <ul data-automation-id="selectedItemList">${row.field ? `<li data-automation-id="selectedItem">${row.field}</li>` : ""}</ul></div>
        <div data-automation-id="formField-gradeAverage"><label for="e${index}a">Overall Result (GPA)</label><input id="e${index}a" ${historyInput("education", index, "gpa")} value="${row.gpa || ""}"></div>
        ${eduDates === "none" ? "" : `<div data-automation-id="formField-firstYearAttended"><label>${eduDates === "ids" ? "Attended From" : "From"}</label>${dateInput("Year", historyInput("education", index, "fromY"), row.fromY || "")}</div>
        <div data-automation-id="formField-lastYearAttended"><label>${eduDates === "ids" ? "Attended Until*" : "To (Actual or Expected)*"}</label>${dateInput("Year", historyInput("education", index, "toY"), row.toY || "")}</div>`}
      </div>`;

    /** /<site>/passwordreset/<token>: Workday's password-reset page (modelled). */
    function renderResetPage(token) {
      const account = Object.values(readAccounts()).find((entry) => entry.resetToken === token);
      const app = document.getElementById("app");
      if (account && account.resetMode === "captcha") {
        app.innerHTML = `<div data-automation-id="noCaptchaWrapper"><iframe title="reCAPTCHA challenge" src="about:blank"></iframe></div>`;

    function resetPassword() {
      const accounts = readAccounts();
      const email = Object.keys(accounts).find((key) => passwordReset && accounts[key].resetToken === passwordReset[1]);
      const password = accountInput("password").value;
      const verify = accountInput("verifyPassword").value;
      if (!email) return accountError("This link has expired or is no longer valid.");
      if (password !== verify) return accountError("The passwords do not match.");
      if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
        return accountError("Password must contain at least 8 characters, an uppercase letter, a lowercase letter, a number and a special character.");
      }
      accounts[email].password = password;
      delete accounts[email].resetToken;
      delete accounts[email].resetMode;
      writeAccounts(accounts);
      document.querySelector('[data-automation-id="signInContent"]').innerHTML =
        `<h2>Your password has been reset.</h2><button type="button" data-automation-id="signInLink">Sign In</button>`;
    }

    /** &resend=1: Workday's "Resend Account Verification" control (modelled effect). */
    function resendVerification() {
      const email = accountInput("email")?.value.trim().toLowerCase() ?? "";
      const accounts = readAccounts();
      if (accounts[email] && !accounts[email].verified) {
        accounts[email].token = `n${Math.random().toString(36).slice(2)}`;
        writeAccounts(accounts);
      }
      bump("fixture-workday-resends");
      document.getElementById("account-notice").innerHTML = "<p>We sent a new verification email. Check your inbox.</p>";
    }

    function createAccount() {
      const email = accountInput("email").value.trim().toLowerCase();
      const password = accountInput("password").value;
      const verify = accountInput("verifyPassword").value;
      const terms = accountInput("createAccountCheckbox").checked;
      if (document.querySelector('[data-automation-id="beecatcher"]').value) {
        window.fixtureAccount.honeypotTyped = true;
        return accountError("Something went wrong.");
      }
      window.fixtureAccount.termsChecked = terms;
      window.fixtureAccount.creates += 1;
      if (!terms) return accountError("You must accept the terms and conditions.");
      if (password !== verify) return accountError("The passwords do not match.");
      if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
        return accountError("Password must contain at least 8 characters, an uppercase letter, a lowercase letter, a number and a special character.");
      }
      const accounts = readAccounts();
      if (accountMode === "exists" || accounts[email]) return accountError("An account already exists for this email address.");
      if (accountMode === "lost") return;
      if (accountMode === "banner") {
        document.getElementById("account-errors").innerHTML =
          `<div data-automation-id="errorBanner" role="alert"><ul><li>We could not create your account right now. Try again later.</li></ul></div>`;
        return;
      }
      const unverified = ["verify", "notice", "quiet", "silent-quiet", "login-redirect"].includes(accountMode);
      accounts[email] = { password, verified: !unverified, token: Math.random().toString(36).slice(2) };
      writeAccounts(accounts);
      if (accountMode === "login-redirect") { location.assign(`${location.pathname.replace(/\/job\/.*$/, "")}/login${location.search}`); return; }
      if (accountMode === "double") return accountError("An account already exists for this email address.");
      if (accountMode === "signin-after" || accountMode === "notice" || accountMode === "quiet") return renderAccount("sign-in");
      if (["silent", "silent-chooser", "silent-quiet"].includes(accountMode)) return;
      if (accountMode === "verify") return accountNotice("<p>We sent an email to verify your account. Open it, then sign in.</p>");
      if (accountMode === "sms") return accountNotice(`<p>Enter the code we sent by text message to your phone.</p><input data-automation-id="verificationCode">`);
      sessionStorage.setItem(SESSION_KEY, email);
      render();
    }

    function signIn() {
      window.fixtureAccount.signIns += 1;
      const email = accountInput("email").value.trim().toLowerCase();
      const password = accountInput("password").value;
      if (document.querySelector('[data-automation-id="beecatcher"]')?.value) {
        window.fixtureAccount.honeypotTyped = true;
        return accountError("Something went wrong.");
      }
      const account = readAccounts()[email];
      if (!account || account.password !== password) {
        if (signInError === "locked") return accountError("Your account has been locked because of too many failed sign-in attempts.");
        if (signInError === "generic") return accountError("You may have entered the wrong email address or password or your account might be locked.");
        return accountError("Wrong email address or password.");
      }
      if (!account.verified && resendMode) {
        accountError("Verify your account before you sign in or request a verification email.");
        document.getElementById("account-notice").innerHTML = '<p>Still can\'t sign in? Be sure to check your spam folder, your account may need verification</p><button type="button" data-fixture-resend>Resend Account Verification</button>';
        return;
      }
      if (!account.verified && accountMode === "notice") {
        document.getElementById("account-notice").innerHTML = "<p>Your account has not been verified. Check your email for the verification link.</p>";
        return;
      }
      if (!account.verified && (accountMode === "quiet" || accountMode === "silent-quiet")) return;
      if (!account.verified && accountMode === "login-redirect") return accountError("You may have entered the wrong email address or password or your account might be locked.");
      if (!account.verified) return accountError("Please verify your account before signing in.");
      sessionStorage.setItem(SESSION_KEY, email);
      render();
    }

    /** Missing required fields as { label, container }. */
    function missingRequired() {
      const missing = [];
      for (const container of document.querySelectorAll('[data-automation-id^="formField-"]')) {
        if (container.querySelector("[data-h], [data-prompt^='history:'], [data-listbox^='history:']")) continue;
        const label = container.querySelector("label").textContent;
        if (!label.endsWith("*")) continue;
        const input = container.querySelector("input:not([type=radio]):not([type=checkbox]), textarea");
        const button = container.querySelector("button[aria-haspopup]");
        if (container.querySelector('[data-automation-id="selectedItemList"]')) {
          if (!container.querySelector('[data-automation-id="selectedItem"]')) missing.push({ label: label.replace("*", ""), container });
          continue;
        }
        const radios = container.querySelectorAll("input[type=radio]");
        const box = container.querySelector("input[type=checkbox]");
        const empty = button ? button.textContent === "Select One"
          : radios.length ? ![...radios].some((radio) => radio.checked)
          : box ? !box.checked
          : !input.value;
        if (empty) missing.push({ label: label.replace("*", ""), container });
      }
      return missing;
    }

    document.addEventListener("change", (event) => {
      if (event.target.matches('input[data-automation-id="file-upload-input-ref"]') && event.target.files[0]) {
        const name = event.target.files[0].name;
        const redraw = () => { const status = document.getElementById("resume-status"); if (status) status.outerHTML = resumeStatus(); };
        if (uploadMode) {
          // ?upload: the file loads for 2.5 s, then is attached (slow) or refused (fail).
          state.upload = { name, phase: "loading" };
          redraw();
          setTimeout(() => {
            if (uploadMode === "fail") state.upload = { name, phase: "failed" };
            else { state.upload = { name, phase: "done" }; state.resumes.push(name); }
            redraw();
          }, 2500);
          return;
        }
        // Workday lists every attached file; a second upload sits beside the first.
        state.resumes.push(name);
        redraw();
      } else if (event.target.matches("#transcript")) {
        state.transcript = event.target.files[0]?.name ?? null;
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || !event.target.matches("input[data-prompt^='history:']")) return;
      const id = event.target.dataset.prompt;
      const words = event.target.value.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
      const source = id.endsWith(":school") ? schools : fields;
      const found = source.filter((option) => words.every((word) => option.toLowerCase().includes(word)));
      document.getElementById("popup").innerHTML = `<div data-prompt-popup="${id}">${found.map((option) => `<div data-automation-id="promptOption">${option}</div>`).join("")}</div>`;
      if (realWidgets) {
        // Drawn over the controls below the input, as Workday's search lists are.
        const rect = event.target.getBoundingClientRect();
        document.querySelector("[data-prompt-popup]").setAttribute("style",
          `position:absolute;left:${rect.left + scrollX}px;top:${rect.bottom + scrollY}px;width:480px;height:1600px;background:#fff;z-index:20;overflow:auto`);
      }
    });
    document.addEventListener("click", (event) => {
      const target = event.target;
      if (target.matches('[data-automation-id="adventureButton"]')) {
        event.preventDefault();
        document.getElementById("popup").innerHTML = `<div data-automation-id="wd-popup-frame">
          <a href="#" data-automation-id="applyManually">Apply Manually</a></div>`;
      } else if (target.matches('[data-automation-id="applyManually"]')) {
        event.preventDefault();
        document.getElementById("popup").innerHTML = "";
        if (params.get("signin") === "1") {
          document.getElementById("app").innerHTML = `<label for="email">Email Address</label><input id="email" type="email">
            <label for="password">Password</label><input id="password" type="password"><button>Sign In</button>`;
          return;
        }
        if (accountMode && !sessionStorage.getItem(SESSION_KEY)) { if (accountMode === "login-redirect") renderSignInMethods(); else renderAccount("create"); return; }
        render();
      } else if (target.matches('[data-automation-id="signInLink"]')) {
        if (accountMode === "silent-chooser" || accountMode === "login-redirect") renderSignInMethods();
        else renderAccount("sign-in");
      } else if (target.matches('[data-automation-id="SignInWithEmailButton"]')) {
        window.fixtureAccount.emailMethodClicks += 1;
        renderAccount("sign-in");
      } else if (target.matches('[data-automation-id="createAccountLink"]')) {
        renderAccount("create");
      } else if (target.matches("[data-fixture-resend]")) {
        resendVerification();
      } else if (forgotMode && target.matches('[data-automation-id="forgotPasswordLink"]')) {
        renderForgot();
      } else if (target.matches('[data-automation-id="utilityMenu"] [data-automation-id="click_filter"]')) {
        // ?header=filter: the header's covered Sign In button; a click on it is only counted.
        window.fixtureAccount.headerClicks += 1;
      } else if (target.matches('[data-automation-id="click_filter"]')) {
        // Only the click filter is clickable, as on Workday; it submits the button it covers, whatever its
        // label ("Submit" on ?filter=submit). The test may watch the moment of submit.
        const covered = target.parentElement?.querySelector('[data-automation-id$="SubmitButton"]');
        const coveredId = covered?.getAttribute("data-automation-id");
        const action = coveredId === "createAccountSubmitButton" ? "Create Account"
          : coveredId === "forgotPasswordSubmitButton" ? "Forgot Password"
          : coveredId === "resetPasswordSubmitButton" ? "Reset Password"
          : "Sign In";
        const handlers = { "Create Account": createAccount, "Sign In": signIn, "Forgot Password": requestReset, "Reset Password": resetPassword };
        if (action === "Forgot Password" && params.get("reset") === "silent") { bump("fixture-workday-ignored-resets"); return; }
        if (dwellMode && (action === "Create Account" || action === "Sign In")) {
          const mountedAt = covered ? submitMounts.get(covered) : undefined;
          const elapsed = mountedAt === undefined ? 0 : performance.now() - mountedAt;
          window.fixtureAccount.submitDelays.push(Math.round(elapsed));
          if (elapsed < 500) { window.fixtureAccount.ignoredSubmits += 1; return; }
        }
        Promise.resolve(window.onFixtureAccountSubmit?.(action)).then(() => handlers[action]());
      } else if (target.closest("[data-add]")) {
        // A click on the Add's inner (visually hidden) text still adds.
        const addButton = target.closest("[data-add]");
        syncHistory();
        state[addButton.dataset.add].push({});
        render();
      } else if (target.closest("[data-add-website]")) {
        syncHistory();
        state.websites += 1;
        render();
      } else if (target.matches("[data-delete]")) {
        syncHistory();
        state[target.dataset.delete].splice(Number(target.dataset.index), 1);
        render();
      } else if (target.matches('[data-automation-id="delete-file"]')) {
        if (state.upload && state.upload.name === state.resumes[Number(target.dataset.file)]) state.upload = null;
        state.resumes.splice(Number(target.dataset.file), 1);
        target.closest('[data-automation-id="file-upload-item"]').remove();
      } else if (target.matches('[data-automation-id="pageFooterBackButton"]')) {
        syncHistory();
        state.step -= 1;
        render();
      } else if (target.matches("input[data-prompt^='history:']")) {
        document.getElementById("popup").innerHTML = "";
      } else if (target.matches("input[data-prompt]")) {
        const id = target.dataset.prompt;
        const options = id === "formField-source" ? Object.keys(sourceTree) : ["United States of America (+1)", "Canada (+1)"];
        const html = `<div data-prompt-popup="${id}">${options.map((option) => `<div data-automation-id="promptOption" data-level="top">${option}</div>`).join("")}</div>`;
        if (realWidgets) {
          clearLists();
          setTimeout(() => { document.getElementById("popup").innerHTML = html; }, 600);
        } else {
          document.getElementById("popup").innerHTML = html;
        }
      } else if (target.matches('#popup [data-automation-id="promptOption"]')) {
        const popup = target.closest("[data-prompt-popup]");
        const id = popup.dataset.promptPopup;
        if (id.startsWith("history:")) {
          const [, kind, index, key] = id.split(":");
          syncHistory();
          state[kind][Number(index)][key] = target.textContent;
          // ?widgets=real: the multi-select Field of Study list stays open after a pick, until Escape.
          if (!(realWidgets && key === "field")) document.getElementById("popup").innerHTML = "";
          render();
          return;
        }
        const children = id === "formField-source" && target.dataset.level === "top" ? sourceTree[target.textContent] : null;
        if (children) {
          const html = children.map((option) => `<div data-automation-id="promptOption" data-level="sub">${option}</div>`).join("");
          if (realWidgets) {
            popup.innerHTML = "";
            setTimeout(() => { popup.innerHTML = html; }, 900);
          } else {
            popup.innerHTML = html;
          }
          return;
        }
        state.values[id] = target.textContent;
        clearLists();
        // Update the chip in place, as Workday does, so typed fields keep their values.
        document.querySelector(`[data-automation-id="${id}"] [data-automation-id="selectedItemList"]`).innerHTML = chip(target.textContent);
      } else if (target.matches("button[aria-haspopup=listbox]")) {
        const id = target.dataset.listbox;
        const options = target.dataset.options.split("|").map((option) => `<li role="option">${option}</li>`).join("");
        if (realWidgets) {
          // A portal of its own, filled a moment later; a list still closing stays on screen.
          const portal = document.createElement("div");
          portal.setAttribute("data-automation-id", "activeListContainer");
          portal.setAttribute("data-fixture-list", "1");
          document.body.appendChild(portal);
          setTimeout(() => { portal.innerHTML = `<ul role="listbox" id="${id}-list" data-for="${id}">${options}</ul>`; }, 400);
        } else {
          document.getElementById("popup").innerHTML = `<ul role="listbox" data-for="${id}">${options}</ul>`;
        }
      } else if (target.matches('[role="option"]') && target.parentElement?.dataset.for) {
        // Picked chips (role="option" with ?widgets=real) never act as options.
        const id = target.parentElement.dataset.for;
        state.values[id] = target.textContent;
        if (id.startsWith("history:")) {
          const [, kind, index, key] = id.split(":");
          state[kind][Number(index)][key] = target.textContent;
        }
        document.querySelector(`[data-listbox="${id}"]`).textContent = target.textContent;
        clearLists();
      } else if (target.matches('[data-automation-id="pageFooterNextButton"]')) {
        if (state.step === steps.length - 1) { state.submitted = true; render(); return; }
        for (const input of document.querySelectorAll("#fields input[type=text], #fields input[type=number]")) {
          state.values[input.closest("[data-automation-id]").getAttribute("data-automation-id")] = input.value;
        }
        syncHistory();
        // ?gaps=1: the start date's three sections are recorded together, and it is missing unless all three are filled.
        const startParts = [...document.querySelectorAll("#fields input[data-start]")].map((input) => input.value);
        if (startParts.length) state.values["formField-earliestStart"] = startParts.every(Boolean) ? startParts.join("/") : "";
        // The previous-worker choice, by its label[for] text (the ?gaps=1 check reads it).
        const previous = document.querySelector('#fields [data-automation-id="formField-candidateIsPreviousWorker"] input[type=radio]:checked');
        if (previous) state.values["formField-candidateIsPreviousWorker"] = document.querySelector(`label[for="${previous.id}"]`)?.textContent ?? previous.value;
        for (const earlier of document.querySelectorAll("[data-fixture-error]")) earlier.remove();
        const missing = missingRequired();
        if (state.step === 1) missing.push(...historyMissing().map((label) => ({ label, container: null })));
        if (state.step === 1 && state.resumes.length === 0) missing.push({ label: "Resume/CV", container: null });
        if (startParts.length && !state.values["formField-earliestStart"]) {
          for (const entry of missing.filter((item) => item.container?.getAttribute("data-automation-id") === "formField-earliestStart")) missing.splice(missing.indexOf(entry), 1);
          missing.push({ label: "What is the earliest date you can start employment?", container: document.querySelector('[data-automation-id="formField-earliestStart"]') });
        }
        if (missing.length) {
          const required = (label) => `The field ${label} is required and must have a value.`;
          const inline = missing.filter((entry) => entry.container);
          for (const entry of inline) {
            entry.container.insertAdjacentHTML("beforeend",
              `<div data-automation-id="errorMessage" role="alert" data-fixture-error><p>Error: ${required(entry.label)}</p></div>`);
          }
          const banner = inline.length
            ? `<div data-automation-id="errorBanner"><button type="button">Errors Found</button><ul>${inline.map((entry) => `<li>${entry.label}: ${required(entry.label)}</li>`).join("")}</ul></div>`
            : "";
          document.getElementById("errors").innerHTML = banner + missing.filter((entry) => !entry.container)
            .map((entry) => `<p data-automation-id="errorMessage">Error: ${entry.label} is required</p>`).join("");
          return;
        }
        // ?linger: the progress bar moves on at once; My Experience's fields stay in the DOM, hidden, until the next step is drawn.
        if (lingerMs > 0 && state.step === 1) {
          state.step += 1;
          document.querySelector('[data-automation-id="progressBar"]').innerHTML = progressItems();
          document.getElementById("fields").style.display = "none";
          setTimeout(render, lingerMs);
          return;
        }
        // ?upload: Workday takes a moment to move on, the upload's status alert still on screen.
        if (uploadMode && state.step === 1) { setTimeout(() => { state.step += 1; render(); }, 1000); return; }
        state.step += 1;
        render();
      }
    });
    // ?school=text: the typed school's suggestion layer, drawn inside the field over the controls below it; only leaving the box closes it.
    // With ?remount=1 it is a portal in <body> beside the form instead (it covers nothing), closed by Escape.
    document.addEventListener("input", (event) => {
      if (!event.target.matches("input[data-suggest]")) return;
      const field = event.target.closest('[data-automation-id^="formField-"]');
      for (const layer of field.querySelectorAll("[data-fixture-suggest]")) layer.remove();
      if (remount) for (const layer of document.querySelectorAll("[data-fixture-list][data-fixture-suggest]")) layer.remove();
      if (!event.target.value) return;
      const layer = document.createElement("ul");
      layer.setAttribute("role", "listbox");
      layer.setAttribute("data-fixture-suggest", "1");
      layer.setAttribute("style", remount
        ? "position:absolute;left:900px;top:0;width:240px;height:40px;margin:0;padding:0;list-style:none;background:#fff;z-index:20"
        : "position:absolute;left:0;top:100%;width:480px;height:320px;margin:0;padding:0;list-style:none;background:#fff;z-index:20");
      const option = document.createElement("li");
      option.setAttribute("role", "option");
      option.textContent = event.target.value;
      layer.appendChild(option);
      if (remount) {
        layer.setAttribute("data-fixture-list", "1");
        document.body.appendChild(layer);
      } else {
        field.appendChild(layer);
      }
    });
    document.addEventListener("focusout", (event) => {
      if (!event.target.matches || !event.target.matches("input[data-suggest]")) return;
      for (const layer of event.target.closest('[data-automation-id^="formField-"]').querySelectorAll("[data-fixture-suggest]")) layer.remove();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      // With ?widgets=real the lists open at the keypress stay on screen 300 ms, then go; a list opened later stays.
      if (realWidgets) {
        const closing = [...document.querySelectorAll("[data-fixture-list]"), ...document.getElementById("popup").children];
        setTimeout(() => { for (const element of closing) element.remove(); }, 300);
      } else {
        clearLists();
        // ?remount=1: Escape on My Experience re-draws the whole step, typed values kept.
        if (remount && state.step === 1) {
          syncHistory();
          clearLists();
          render();
        }
      }
    });
  </script>
