<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Robotics Software Intern - Fixture Robotics Careers</title></head>
<body>
  <!--
    A fictional Oracle Cloud HCM Candidate Experience email step ("Fixture Robotics", served at
    /apply/email). DERIVED, not captured: no Oracle page was loaded for it. It reproduces the ways
    a button's text could become a field label on Oracle JET pages (the Corvane run read a
    "Discard" field): a terms checkbox with no label of its own beside an oj-button whose label
    sits in a `.oj-button-label` element, an input[type=button] "Back", an input[type=reset]
    "Cancel", and a "Next" button.
  -->
  <main class="app-main">
    <h1>Robotics Software Intern</h1>
    <form class="apply-flow-email" novalidate>
      <div class="input-row">
        <label for="primary-email">Email Address</label>
        <input id="primary-email" type="email" name="primaryEmail" aria-required="true">
      </div>
      <div class="apply-flow-terms">
        <input type="checkbox" name="legalDisclaimer" id="legal-disclaimer">
        <button type="button" class="oj-button"><div class="oj-button-label"><span>Discard</span></div></button>
      </div>
      <div class="apply-flow-navigation">
        <input type="button" value="Back" aria-label="Back">
        <input type="reset" value="Cancel" aria-label="Cancel">
        <button type="button" class="oj-button"><div class="oj-button-label"><span>Next</span></div></button>
      </div>
    </form>
  </main>
  <footer><span>© Oracle Corporation</span></footer>
</body>
</html>
