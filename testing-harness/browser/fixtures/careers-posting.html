<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Robotics Software Intern | Fixture Robotics Careers</title></head>
<body>
  <!--
    A fictional company careers posting page ("Fixture Robotics", served at
    careers.fixturerobotics.com/jobs/1001) with no form: the application sits behind its own
    "Apply for this job" link. Derived from the posting-page shapes of the 2026-11-20 read-only
    captures (Jobvite and iCIMS posting pages: an Apply link beside sharing and third-party apply
    buttons); nothing was copied, and no tokens or personal data are included. The agent follows
    only the site's own Apply link: never "Apply with LinkedIn", "Apply on Indeed", or the
    LinkedIn share link.
  -->
  <main>
    <h1>Robotics Software Intern</h1>
    <p>Fixture Robotics builds fictional robots. Location: Springfield, IL.</p>
    <div class="actions">
      <button type="button" class="linkedin-apply">Apply with LinkedIn</button>
      <a href="https://www.indeed.com/viewjob?jk=fixture">Apply on Indeed</a>
      <a class="apply" href="/jobs/1001/apply">Apply for this job</a>
      <a class="share" href="https://www.linkedin.com/sharing/share-offsite/?url=https%3A%2F%2Fcareers.fixturerobotics.com%2Fjobs%2F1001">Share on LinkedIn</a>
    </div>
  </main>
</body>
</html>
