<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply: Robotics Software Intern | Fixture Robotics Careers</title></head>
<body>
  <!--
    The fictional application form the "Apply for this job" link of careers-posting.html reaches
    (careers.fixturerobotics.com/jobs/1001/apply). Hand-written; no tokens or personal data.
  -->
  <main>
    <h1>Apply: Robotics Software Intern</h1>
    <form id="application" novalidate>
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" type="text" required>
      <label for="last_name">Last Name</label>
      <input id="last_name" name="last_name" type="text" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="resume">Resume</label>
      <input id="resume" name="resume" type="file" required>
      <button type="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
