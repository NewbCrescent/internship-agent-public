<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Robotics Intern at Fixture Health</title></head>
<body>
  <!--
    A synthetic Greenhouse embedded application (job-boards.greenhouse.io/embed/job_app, board
    "fixturehealth"). DERIVED, not captured: fictional company, no personal data. First Name, Last
    Name, Email, Phone, Resume, and a terminal "Submit application" that never sends anything.
  -->
  <main>
    <h1>Robotics Intern</h1>
    <form id="application-form" onsubmit="event.preventDefault();">
      <div><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" required></div>
      <div><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" required></div>
      <div><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
      <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
      <div><label for="resume">Resume *</label><input id="resume" name="resume" type="file" required></div>
      <button type="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
